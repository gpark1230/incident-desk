services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: incident_desk_user
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: incident_desk
    ports:
      - "5433:5432" # host 5433 -> avoids clashing with a locally-running Postgres on 5432
    volumes:
      - incident_desk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_desk_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # "db" is the service name above -- Compose's internal DNS resolves it
      # to the db container, on its internal port 5432 (unaffected by the
      # 5433 host remap, which only matters for connecting from outside Compose).
      DATABASE_URL: postgresql://incident_desk_user:devpassword123@db:5432/incident_desk
      SECRET_KEY: dev-compose-secret-change-me
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  incident_desk_pgdata:
